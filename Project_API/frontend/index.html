<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Marketplace</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<h1>Car Marketplace</h1>
<div id="carsContainer" class="cars-grid"></div>

<script>
async function loadCars() {
    const resp = await fetch('../api/cars.php');
    const data = await resp.json();
    const container = document.getElementById('carsContainer');
    if(data.success){
        container.innerHTML = '';
        data.cars.forEach(car => {
            const div = document.createElement('div');
            div.className = 'car-card';
            div.innerHTML = `
                <img src="${car.main_image_url}" alt="${car.title}">
                <h3>${car.title}</h3>
                <p>Year: ${car.year} | Color: ${car.color}</p>
                <p>Price: $${car.price}</p>
                <p>Phone: ${car.phone}</p>
                <a href="car.html?id=${car.id}">View Details</a>
            `;
            container.appendChild(div);
        });
    }
}

loadCars();
</script>
</body>
</html>
